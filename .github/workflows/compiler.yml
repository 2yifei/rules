name: Auto Compile MRS

on:
  schedule:
    - cron: '0 22 * * *' # 每天北京时间早上 6 点自动运行
  workflow_dispatch: # 允许网页端随时手动点击运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install Mihomo
        run: |
          mkdir -p bin build
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-linux-amd64-v1.19.26.gz" -o bin/mihomo.gz
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo
          echo "mixed-port: 0" > build/config.yaml

      - name: Compile Direct-DIY Rule (Remote Merge)
        run: |
          curl -sSLf "https://raw.githubusercontent.com/Seven1echo/Yaml/refs/heads/main/rules/Seven1_Direct_Domain.mrs" -o build/remote_direct.mrs || true
          
          if [ -f build/remote_direct.mrs ]; then
            timeout 10s mihomo cli ruleset unpack build/remote_direct.mrs -o build/remote_direct.yaml -d build || true
          fi
          
          echo "payload:" > build/direct-diy.yaml
          if [ -f build/remote_direct.yaml ]; then
            grep -E '^  - ' build/remote_direct.yaml >> build/direct-diy.yaml || true
          fi
          
          # 核心修复：智能读取你的 list，去除空行，并自动加双引号和缩进，转换成合法 YAML 列表
          if [ -f direct-diy.list ]; then
            sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d; s/^/  - "/; s/$/"/' direct-diy.list >> build/direct-diy.yaml
          fi
          
          timeout 10s mihomo cli ruleset compile build/direct-diy.yaml -d build || true
          
          if [ -f build/direct-diy.mrs ]; then
            mv build/direct-diy.mrs ./direct-diy.mrs
          fi

      - name: Compile Proxy-DIY Rule (Local Only)
        run: |
          echo "payload:" > build/proxy-diy.yaml
          
          # 同样：智能转换 proxy-diy.list 为合法 YAML 列表
          if [ -f proxy-diy.list ]; then
            sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d; s/^/  - "/; s/$/"/' proxy-diy.list >> build/proxy-diy.yaml
          fi
          
          timeout 10s mihomo cli ruleset compile build/proxy-diy.yaml -d build || true
          
          if [ -f build/proxy-diy.mrs ]; then
            mv build/proxy-diy.mrs ./proxy-diy.mrs
          fi

      - name: Commit and Push Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          [ -f direct-diy.mrs ] && git add direct-diy.mrs
          [ -f proxy-diy.mrs ] && git add proxy-diy.mrs
          
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: Compiled MRS rules"
            git push origin main
          else
            echo "No changes to commit, skipping push."
          fi

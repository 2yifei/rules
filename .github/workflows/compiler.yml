name: Auto Compile MRS

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - '*.list'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install Mihomo
        run: |
          mkdir -p bin
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-linux-amd64-v1.19.26.gz" -o bin/mihomo.gz
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo

      - name: Compile Your Direct Rules
        run: |
          if [ -f direct-diy.list ]; then
            # 清洗不可见字符
            sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' direct-diy.list > clean-direct.txt
            mihomo convert-ruleset domain text clean-direct.txt direct-diy.mrs
          fi

      - name: Compile Your Proxy Rules
        run: |
          if [ -f proxy-diy.list ]; then
            sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' proxy-diy.list > clean-proxy.txt
            mihomo convert-ruleset domain text clean-proxy.txt proxy-diy.mrs
          fi

      - name: Commit and Push Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          [ -f direct-diy.mrs ] && git add direct-diy.mrs
          [ -f proxy-diy.mrs ] && git add proxy-diy.mrs
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: Compiled MRS rules"
            git push origin main
          else
            echo "✅ 一切正常：文件未发生实质性更改。"
          fi

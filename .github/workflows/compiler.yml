name: Auto Compile MRS

on:
  schedule:
    - cron: '0 22 * * *' # 每天北京时间早上 6 点自动运行，保持与对方同步
  workflow_dispatch: # 允许你改完所有文件后，在网页端手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install Mihomo
        run: |
          mkdir -p bin
          # 下载官方预编译版，极速完成环境配置
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-linux-amd64-v1.19.26.gz" -o bin/mihomo.gz
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo

      - name: Compile Direct-DIY Rule (Remote Merge)
        run: |
          mkdir -p build
          # 1. 下载对方提供的 Seven1_Direct_Domain.mrs 二进制文件
          curl -sSLf "https://raw.githubusercontent.com/Seven1echo/Yaml/refs/heads/main/rules/Seven1_Direct_Domain.mrs" -o build/remote_direct.mrs
          
          # 2. 反编译为 yaml 纯文本
          mihomo cli ruleset unpack build/remote_direct.mrs -o build/remote_direct.yaml
          
          # 3. 创建标准规则文件头
          echo "payload:" > build/direct-diy.yaml
          
          # 4. 提取对方规则的有效条目
          grep -E '^  - ' build/remote_direct.yaml >> build/direct-diy.yaml || true
          
          # 5. 检查本地 direct-diy.list 是否存在，若存在则追加到末尾
          if [ -f direct-diy.list ]; then
            cat direct-diy.list >> build/direct-diy.yaml
          fi
          
          # 6. 重新编译为最终的高效 direct-diy.mrs 文件
          mihomo cli ruleset compile build/direct-diy.yaml
          mv build/direct-diy.mrs ./direct-diy.mrs

      - name: Compile Proxy-DIY Rule (Local Only)
        run: |
          # 1. 创建标准规则文件头
          echo "payload:" > build/proxy-diy.yaml
          
          # 2. 检查本地 proxy-diy.list 是否存在并写入
          if [ -f proxy-diy.list ]; then
            cat proxy-diy.list >> build/proxy-diy.yaml
          fi
          
          # 3. 直接编译为 proxy-diy.mrs 文件
          mihomo cli ruleset compile build/proxy-diy.yaml
          mv build/proxy-diy.mrs ./proxy-diy.mrs

      - name: Commit and Push Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add direct-diy.mrs proxy-diy.mrs
          # 智能提交：只有当生成的文件真的发生变动时才会 commit，避免没有任何更新时报错
          git commit -m "Automated update: Compiled MRS rules" || echo "No changes detected, skipping commit."
          git push origin main

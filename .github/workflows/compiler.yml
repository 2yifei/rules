name: Auto Compile MRS

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install Mihomo
        run: |
          mkdir -p bin build
          curl -sSLf "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-linux-amd64-v1.19.26.gz" -o bin/mihomo.gz
          gzip -d bin/mihomo.gz
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo
          echo "mixed-port: 0" > build/config.yaml

      - name: Compile Direct-DIY Rule (Remote Merge)
        run: |
          # 🔴 核心修复 1：彻底清洗你上传的文本，干掉 Windows 回车符(\r)和首尾空格
          if [ -f direct-diy.list ]; then
            sed -i 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' direct-diy.list
          fi
          
          curl -sSLf "https://raw.githubusercontent.com/Seven1echo/Yaml/refs/heads/main/rules/Seven1_Direct_Domain.mrs" -o build/remote_direct.mrs || true
          
          if [ -f build/remote_direct.mrs ]; then
            timeout 5s mihomo cli ruleset unpack build/remote_direct.mrs -o build/remote_direct.yaml -d build || true
          fi
          
          echo "payload:" > build/direct-diy.yaml
          if [ -f build/remote_direct.yaml ]; then
            grep -E '^  - ' build/remote_direct.yaml >> build/direct-diy.yaml || true
          fi
          
          if [ -f direct-diy.list ]; then
            sed 's/^/  - "/; s/$/"/' direct-diy.list >> build/direct-diy.yaml
          fi
          
          timeout 5s mihomo cli ruleset compile build/direct-diy.yaml -d build || true
          
          # 🔴 核心修复 2：如果编译失败没产出文件，立刻报错阻断，并打印出问题在哪！
          if [ ! -f build/direct-diy.mrs ]; then
            echo "❌ 严重错误：direct-diy.mrs 编译失败！极可能是合并后的格式不合法。"
            echo "--- 合并后的前20行 ---"
            head -n 20 build/direct-diy.yaml
            echo "--- 合并后的最后20行 (你的自定义部分) ---"
            tail -n 20 build/direct-diy.yaml
            exit 1
          fi
          
          mv build/direct-diy.mrs ./direct-diy.mrs

      - name: Compile Proxy-DIY Rule (Local Only)
        run: |
          # 同样进行清洗
          if [ -f proxy-diy.list ]; then
            sed -i 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' proxy-diy.list
          fi
          
          echo "payload:" > build/proxy-diy.yaml
          
          if [ -f proxy-diy.list ]; then
            sed 's/^/  - "/; s/$/"/' proxy-diy.list >> build/proxy-diy.yaml
          fi
          
          timeout 5s mihomo cli ruleset compile build/proxy-diy.yaml -d build || true
          
          # 如果文件没生成，报错阻断并打印
          if [ ! -f build/proxy-diy.mrs ]; then
            echo "❌ 严重错误：proxy-diy.mrs 编译失败！请检查 proxy-diy.list 是否有非法字符。"
            cat build/proxy-diy.yaml
            exit 1
          fi
          
          mv build/proxy-diy.mrs ./proxy-diy.mrs

      - name: Commit and Push Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # 强行打印一下当前目录，确保文件真的在！
          echo "当前目录文件列表："
          ls -la
          
          git add direct-diy.mrs proxy-diy.mrs
          
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: Compiled MRS rules"
            git push origin main
          else
            echo "No changes to commit, skipping push."
          fi
